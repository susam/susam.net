<!-- Comment {{ cm-gserial }} of {{ cm-count }} -->
<section id="{{ cm-gserial }}" class="{{ cm-class }}">
<h2>{{ cm-author }} commented on <a href="{{ root }}{{ on-path }}"><em>{{ on-title }}</em></a>:</h2>
{{ body }}<div>
<a href="#{{ cm-gserial }}">{{ cm-long-date }}</a> |
<a href="#{{ cm-gserial }}">#{{ cm-gserial }} of {{ cm-count }} {{ cm-label }}</a> |
<a href="{{ root }}{{ cm-page-path }}#{{ cm-fserial }}">View original comment</a>
</div>
</section>
